# Gate of record for EdgeVector/fkanban (GitHub, since 2026-09-30).
# Brain: decision-2026-09-29-retire-lastgit-all-repos-to-github,
#        sop-github-artifact-app-migration.
#
# `ci-required` is the branch-protection check. It needs `test`, which runs
# .lastgit/ci.sh unchanged (shell syntax, schema-sync boundary, test-timeout
# boundary, typecheck, artifact build + smoke, bun test). `publish` runs on a
# push to main only, after the gate is green, and uploads the host-track
# artifact `ht-artifact-<sha>`. `host-track refresh kanban` on the Mac pulls it
# (last-stack-github-artifact-pull), re-checks every digest, and promotes the
# stable channel. This replaces the Forge CI publish job and the LastGit
# artifact-release watcher.
name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-required-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Plain text: two list-output tests compare uncolored output.
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - name: Every needed job succeeded
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  publish:
    name: publish
    needs: [ci-required]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: EdgeVector/last-stack/.github/workflows/host-track-artifact.yml@main
    with:
      # dist/ holds compiled bun binaries. host-track installs on Apple
      # silicon, so build on a macOS arm64 runner. The smoke script fails the
      # job when a linked binary is missing or `--help` fails.
      runs-on: macos-latest
      setup-bun: true
      build-command: "bun install --frozen-lockfile && bun run build && bash scripts/artifact-smoke.sh"
