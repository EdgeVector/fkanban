# Gate of record for EdgeVector/fkanban (GitHub, since 2026-09-30).
# Brain: decision-2026-09-29-retire-lastgit-all-repos-to-github,
#        sop-github-artifact-app-migration.
#
# `ci-required` is the branch-protection check. It needs `gate`, which runs
# .lastgit/ci.sh (shell syntax, schema-sync boundary, typecheck, artifact
# build + smoke). The tests were deleted (Tom, 2026-10-09). `publish` runs on a
# push to main only, after the gate is green, and uploads the app registry
# artifact `ht-artifact-<sha>`. `app registry refresh kanban` on the Mac pulls it
# (last-stack-github-artifact-pull), re-checks every digest, and promotes the
# stable channel. This replaces the Forge CI publish job and the LastGit
# artifact-release watcher.
name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-required-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Merge gate (.lastgit/ci.sh)
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Every needed job succeeded
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = success

  registry-commit:
    name: Registry commit identity
    needs: [ci-required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/registry-commit.py
