# Forge CI for fkanban on the local Forgejo forge, the gate of record since
# 2026-09-05 (brain: decision-2026-09-05-factory-repos-venue-back-to-forgejo).
#
# ci-required runs the same .lastgit/ci.sh that gated LastGit change requests,
# on the Mac host lane (macos-arm64), so the gate itself does not change with
# the venue. Branch protection on main requires this context.
#
# publish runs only on a push to main. It builds the host-track artifact,
# publishes it into the local LastGit artifact CAS (~/.lastgit/artifacts), and
# promotes it to the stable channel with `lastgit artifact promote --gate
# forgejo` (EdgeVector/lastgit#591), which reads THIS commit's Forge CI status
# instead of a LastGit ci-required row. The repo is disabled on LastGit, so no
# step here pushes code to lastdb:///fkanban; host-track then installs the
# channel head on its next refresh.
name: Forge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci-required:
    name: ci-required
    runs-on: macos-arm64
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Host toolchains on PATH
        run: |
          for d in "$HOME/.local/bin" "$HOME/.bun/bin" "$HOME/.cargo/bin" /opt/homebrew/bin; do
            echo "$d" >> "$GITHUB_PATH"
          done

      - name: Merge gate (.lastgit/ci.sh)
        run: bash .lastgit/ci.sh

  publish:
    name: publish host-track artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-required
    runs-on: macos-arm64
    timeout-minutes: 20
    env:
      FORGE_TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
      LASTGIT_FORGE_URL: http://localhost:3300

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Host toolchains on PATH
        run: |
          for d in "$HOME/.local/bin" "$HOME/.bun/bin" "$HOME/.cargo/bin" /opt/homebrew/bin; do
            echo "$d" >> "$GITHUB_PATH"
          done

      - name: Build the artifact tree
        run: bun run build

      - name: Publish into the artifact CAS and promote stable
        run: |
          set -euo pipefail
          app="$(jq -r '.artifacts[0].app' .lastgit/artifacts.json)"
          paths="$(jq -r '.artifacts[0].paths | join(",")' .lastgit/artifacts.json)"
          digest="$(lastgit artifact publish --app "$app" --repo fkanban --oid "$GITHUB_SHA" --input . --paths "$paths" --json 2>/dev/null \
            | jq -r 'select(.manifest_digest != null) | .manifest_digest' | tail -n 1)"
          test -n "$digest"
          echo "published $app manifest=$digest oid=$GITHUB_SHA"
          # The success status for this push is written when ci-required finishes;
          # give the forge a moment before reading it back.
          for attempt in 1 2 3 4 5 6; do
            if lastgit artifact promote --gate forgejo --app "$app" --channel stable \
                 --manifest "$digest" --repo fkanban --oid "$GITHUB_SHA"; then
              exit 0
            fi
            echo "promote attempt $attempt did not pass the forge gate yet; retrying in 10s" >&2
            sleep 10
          done
          exit 1
